<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student registration</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="javascript" defer></script>
</head>
<body>
    <h1 id="title">student registration form</h1>
    <form class="sol">
        <div class="reg">
            <input type="text" id="full name" placeholder="enter your name">

        </div><br>
         <div class="email">
            <input type="email" id="email" placeholder="enter your email">

        </div><br>
         <div class="phone">
            <input type="number" id="phone" placeholder="enter your phone">

        </div><br>
         <div class="password">
            <input type="text" id="paswored" placeholder="enter your paswaored">

        </div><br>
         <div class="age">
            <input type="text" id="age" placeholder="enter your age">

        </div><br>
        <button class="message">register</button>

    </form>
</body>
</html>
